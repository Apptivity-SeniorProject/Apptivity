map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream api_backend {
    server api:8080;
}

upstream web_frontend {
    server web:80;
}

# IP / Tanımsız Domain bağlantılarını düşür (HTTP)
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# IP / Tanımsız Domain bağlantılarını düşür (HTTPS)
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Doğru domain geldiğinde HTTP -> HTTPS yönlendirmesi yap
server {
    listen 80;
    server_name apptivity.com.tr www.apptivity.com.tr;
    return 301 https://$host$request_uri;
}

# Ana HTTPS Bloğu
server {
    listen 443 ssl;
    server_name apptivity.com.tr www.apptivity.com.tr;

    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # ── APK İndirme ──
    location = /apptivity.apk {
        root /usr/share/nginx/html;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="apptivity.apk"';
    }

    # ── API istekleri → backend ──
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

        # Dosya upload limiti
        client_max_body_size 12M;
    }

    # ── SignalR WebSocket → backend ──
    location /hubs/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;

        # WebSocket bağlantı timeout (24 saat)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ── Health check → backend ──
    location /health {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
    }

    # ── Swagger UI → backend ──
    location /swagger {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    # ── Diğer tüm istekler → frontend ──
    location / {
        proxy_pass http://web_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }
}
