spring.application.name=apptivity-backend
server.port=8080

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/apptivity
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ─── JWT ──────────────────────────────────────────────────────────────────────
# Üretim ortamında bu değeri environment variable ile dışarıdan ver!
app.jwt.secret=CHANGE_ME_USE_A_STRONG_256_BIT_SECRET_KEY_HERE
app.jwt.expiration-ms=86400000

# ─── Swagger / SpringDoc ──────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
