# =============================================
# Apptivity Production Compose — GHCR Images
# =============================================
# Bu dosyayı sunucuya kopyalayıp .env.prod ile kullanın:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Önce GHCR'a login olun:
#   echo $GITHUB_TOKEN | docker login ghcr.io -u <GITHUB_USER> --password-stdin

services:
  postgres:
    image: postgres:16-alpine
    container_name: apptivity-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apptivity}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apptivity-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-apptivity}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apptivity-redis
    restart: always
    networks:
      - apptivity-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/apptivity-seniorproject/apptivity-monorepo/api:${IMAGE_TAG:-latest}
    container_name: apptivity-api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-apptivity};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__Redis: redis:6379
      Jwt__Issuer: ${JWT_ISSUER:-Apptivity.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Apptivity.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost}
      Fcm__Enabled: ${FCM_ENABLED:-false}
      Fcm__ServerKey: ${FCM_SERVER_KEY:-}
      Admin__Email: ${Admin__Email:-}
      Admin__Password: ${Admin__Password:-}
      Groq__ApiKey: ${Groq__ApiKey:-}
      Groq__BaseUrl: ${Groq__BaseUrl:-https://api.groq.com/openai/v1}
      Groq__Model: ${Groq__Model:-openai/gpt-oss-20b}
      Groq__TimeoutMs: ${Groq__TimeoutMs:-120}
    networks:
      - apptivity-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/apptivity-seniorproject/apptivity-monorepo/web:${IMAGE_TAG:-latest}
    container_name: apptivity-web
    restart: always
    networks:
      - apptivity-net
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: ghcr.io/apptivity-seniorproject/apptivity-monorepo/nginx:${IMAGE_TAG:-latest}
    container_name: apptivity-nginx
    restart: always
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    networks:
      - apptivity-net
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - ./apptivity.apk:/usr/share/nginx/html/apptivity.apk:ro

networks:
  apptivity-net:
    driver: bridge

volumes:
  postgres_data:
