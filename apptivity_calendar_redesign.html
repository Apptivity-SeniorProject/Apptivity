
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
.phone {
  max-width: 375px; margin: 0 auto;
  background: var(--color-background-tertiary);
  border-radius: 24px; overflow: hidden;
  border: 0.5px solid var(--color-border-tertiary);
  font-family: var(--font-sans);
}
.status-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 20px 0; font-size: 13px; font-weight: 500;
  color: var(--color-text-primary); background: var(--color-background-primary);
}
.topbar {
  background: var(--color-background-primary);
  border-bottom: 0.5px solid var(--color-border-tertiary);
  padding: 0 16px; height: 44px;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-left { display: flex; align-items: center; gap: 8px; }
.topbar-logo-icon {
  width: 26px; height: 26px; background: #77e349;
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
}
.topbar-logo-icon i { font-size: 15px; color: #1a4a05; }
.topbar-logo-text { font-size: 17px; font-weight: 700; color: #5bcc2a; }

/* CALENDAR SECTION */
.calendar-wrap {
  background: var(--color-background-primary);
  padding: 16px 16px 12px;
  border-bottom: 0.5px solid var(--color-border-tertiary);
}

/* Month nav */
.month-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.month-nav-btn {
  width: 34px; height: 34px;
  border-radius: 10px;
  background: var(--color-background-secondary);
  border: 0.5px solid var(--color-border-secondary);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.month-nav-btn i { font-size: 18px; color: var(--color-text-secondary); }
.month-title { font-size: 16px; font-weight: 600; color: var(--color-text-primary); }

/* Day headers */
.day-headers {
  display: grid; grid-template-columns: repeat(7, 1fr);
  margin-bottom: 6px;
}
.day-header {
  text-align: center; font-size: 11px; font-weight: 600;
  color: var(--color-text-tertiary); padding: 4px 0;
  text-transform: uppercase; letter-spacing: 0.3px;
}

/* Calendar grid */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-day {
  display: flex; flex-direction: column; align-items: center;
  padding: 4px 0; cursor: pointer; position: relative;
}
.cal-day-num {
  width: 32px; height: 32px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 400; color: var(--color-text-primary);
}
.cal-day.today .cal-day-num {
  background: #77e349; color: #1a4a05; font-weight: 700;
}
.cal-day.selected .cal-day-num {
  background: #f0fce8; color: #357c1c; font-weight: 600;
  border: 1.5px solid #77e349;
}
.cal-day.other-month .cal-day-num { color: var(--color-text-tertiary); }
.cal-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: #77e349; margin-top: 2px;
}
.cal-dot.hidden { visibility: hidden; }

/* SELECTED DATE HEADER */
.date-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px;
  background: var(--color-background-primary);
  margin-top: 8px;
}
.date-title { font-size: 15px; font-weight: 600; color: var(--color-text-primary); }
.date-count {
  font-size: 12px; font-weight: 500;
  background: #f0fce8; color: #357c1c;
  border: 0.5px solid #bbf09e;
  padding: 3px 10px; border-radius: 20px;
}
.date-count.empty { background: var(--color-background-secondary); color: var(--color-text-tertiary); border-color: var(--color-border-secondary); }

/* EVENT LIST */
.events-wrap { padding: 0 16px 12px; background: var(--color-background-primary); }
.list-card {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px; border-radius: 12px;
  border: 0.5px solid var(--color-border-tertiary);
  background: var(--color-background-primary);
  margin-bottom: 8px;
}
.list-thumb {
  width: 72px; height: 72px; border-radius: 10px;
  flex-shrink: 0; overflow: hidden; position: relative;
  display: flex; align-items: center; justify-content: center;
}
.list-thumb i { font-size: 24px; color: rgba(255,255,255,0.2); }
.thumb-badge {
  position: absolute; top: 5px; left: 5px;
  background: rgba(255,255,255,0.15); color: #fff;
  font-size: 8px; font-weight: 700;
  padding: 1px 5px; border-radius: 4px; letter-spacing: 0.3px;
}
.list-body { flex: 1; min-width: 0; }
.list-title { font-size: 14px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 5px; }
.list-meta-row {
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; color: var(--color-text-secondary); margin-bottom: 3px;
}
.list-meta-row i { font-size: 13px; }
.list-badges { display: flex; gap: 6px; margin-top: 6px; }
.badge-free { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 5px; background: #f0fce8; color: #357c1c; border: 0.5px solid #bbf09e; }
.badge-spot { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--color-text-secondary); }
.badge-spot i { font-size: 12px; }

/* EMPTY STATE */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  padding: 32px 16px;
  background: var(--color-background-primary);
}
.empty-icon {
  width: 56px; height: 56px;
  background: var(--color-background-secondary);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 12px;
  border: 0.5px solid var(--color-border-tertiary);
}
.empty-icon i { font-size: 26px; color: var(--color-text-tertiary); }
.empty-title { font-size: 14px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 4px; }
.empty-sub { font-size: 12px; color: var(--color-text-secondary); text-align: center; }

/* TABBAR */
.tabbar {
  background: var(--color-background-primary);
  border-top: 0.5px solid var(--color-border-tertiary);
  display: flex; padding: 8px 0 16px; margin-top: 8px;
}
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--color-text-tertiary); font-size: 10px; }
.tab i { font-size: 22px; }
.tab.active { color: #5bcc2a; }
.tab-active-pill { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tab-active-pill .pill-bg { position: absolute; top: -4px; width: 38px; height: 30px; background: #f0fce8; border-radius: 10px; z-index: 0; }
.tab-active-pill i, .tab-active-pill span { position: relative; z-index: 1; }
.tab-fab { flex: 1; display: flex; align-items: center; justify-content: center; }
.fab-center { width: 46px; height: 46px; background: #77e349; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-top: -20px; }
.fab-center i { font-size: 24px; color: #1a4a05; }
</style>
