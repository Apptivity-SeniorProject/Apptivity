name: "🔧 Backend CI"

on:
  push:
    paths:
      - "services/backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "services/backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: apptivity
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apptivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: services/backend/pom.xml

      - name: 🔨 Compile
        run: mvn compile -B -q

      - name: 🧪 Run Tests
        run: mvn test -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/apptivity
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: test1234

      - name: 📦 Package JAR
        run: mvn package -DskipTests -B -q

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: services/backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Build Docker Image
        run: docker build -t apptivity-backend:ci .
