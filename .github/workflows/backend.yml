name: "Backend CI"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    paths:
      - "services/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "services/backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore services/backend/Apptivity.Backend.sln

      - name: Build
        run: dotnet build services/backend/Apptivity.Backend.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test services/backend/Apptivity.Backend.sln --configuration Release --no-build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-test

    defaults:
      run:
        working-directory: services/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t apptivity-backend:ci .

