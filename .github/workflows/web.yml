name: "🌐 Web CI"

on:
  push:
    paths:
      - "apps/web/**"
      - "docker-compose.yml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "docker-compose.yml"
      - ".github/workflows/web.yml"

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔍 Lint
        run: npm run lint -w web

      - name: 🏗️ Build
        run: npm run build -w web

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Build Docker Image
        run: docker build -t apptivity-web:ci -f apps/web/Dockerfile .
