name: "Build & Push Docker Images"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/apptivity-seniorproject/apptivity-monorepo

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ── Backend API ──
      - name: Build & Push API image
        uses: docker/build-push-action@v6
        with:
          context: ./services/backend
          file: ./services/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:${{ steps.tag.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}/api:latest

      # ── Web Frontend ──
      - name: Build & Push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:${{ steps.tag.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}/web:latest

      # ── Nginx Gateway ──
      - name: Build & Push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/nginx:${{ steps.tag.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}/nginx:latest

      - name: Summary
        run: |
          echo "### 🐳 Docker Images Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.IMAGE_PREFIX }}/api\` | \`${{ steps.tag.outputs.VERSION }}\`, \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.IMAGE_PREFIX }}/web\` | \`${{ steps.tag.outputs.VERSION }}\`, \`latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`${{ env.IMAGE_PREFIX }}/nginx\` | \`${{ steps.tag.outputs.VERSION }}\`, \`latest\` |" >> $GITHUB_STEP_SUMMARY
