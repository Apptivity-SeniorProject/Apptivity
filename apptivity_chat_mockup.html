
<style>
  :root {
    --p50:#f0fce8;--p100:#ddf8cc;--p200:#bbf09e;--p300:#95e56b;
    --p400:#77e349;--p600:#44a31e;--p700:#357c1c;--p800:#2d621b;--p900:#28531b;
    --surf:#FFFFFF;--surf2:#F9FAFB;--surf3:#F3F4F6;
    --r-card:14px;--r-btn:10px;
  }
  .phone{width:340px;background:var(--surf);border-radius:40px;border:1.5px solid #e5e7eb;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;height:680px;}
  .sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 4px;font-size:12px;color:var(--p900);font-weight:500;flex-shrink:0;}

  /* Header */
  .chat-header{display:flex;align-items:center;gap:10px;padding:10px 16px 10px;border-bottom:0.5px solid #e5e7eb;flex-shrink:0;background:var(--surf);}
  .back-btn{width:34px;height:34px;border-radius:10px;background:var(--surf2);border:0.5px solid #e5e7eb;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .chat-avatar{width:36px;height:36px;border-radius:10px;background:var(--p50);border:1px solid var(--p200);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .chat-meta{flex:1;}
  .chat-title{font-size:13px;font-weight:500;color:var(--p900);margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
  .chat-sub{font-size:11px;color:#6b7280;margin:0;display:flex;align-items:center;gap:4px;}
  .online-dot{width:6px;height:6px;border-radius:50%;background:var(--p400);}
  .notif-btn{width:34px;height:34px;border-radius:10px;background:var(--surf2);border:0.5px solid #e5e7eb;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
  .notif-badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:#ef4444;color:#fff;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--surf);}

  /* Body */
  .chat-body{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surf2);padding:16px;}
  .empty-state{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;}
  .empty-icon{width:60px;height:60px;background:var(--p50);border-radius:18px;border:1px solid var(--p200);display:flex;align-items:center;justify-content:center;}
  .empty-title{font-size:15px;font-weight:500;color:var(--p900);margin:0;}
  .empty-desc{font-size:12px;color:#9ca3af;margin:0;line-height:1.5;}

  /* Input area */
  .input-area{padding:10px 12px;background:var(--surf);border-top:0.5px solid #e5e7eb;display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .msg-input{flex:1;background:var(--surf2);border:0.5px solid #e5e7eb;border-radius:22px;padding:10px 16px;font-size:13px;color:var(--p900);}
  .send-btn{width:38px;height:38px;background:var(--p400);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  /* Bottom Nav */
  .bottom-nav{display:flex;align-items:center;justify-content:space-around;padding:8px 0 14px;border-top:0.5px solid #e5e7eb;background:var(--surf);flex-shrink:0;}
  .nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#9ca3af;min-width:52px;}
  .nav-item.active{color:var(--p600);}
  .nav-center{width:48px;height:48px;background:var(--p400);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-top:-10px;box-shadow:0 4px 12px rgba(119,227,73,0.4);}
</style>

<div style="padding:1.5rem 0;background:var(--surf3);border-radius:16px;">
  <div class="phone">
    <!-- Status Bar -->
    <div class="sbar">
      <span>15:19</span>
      <div style="display:flex;gap:5px;align-items:center;">
        <i class="ti ti-signal-3g" style="font-size:13px;color:#374151"></i>
        <i class="ti ti-wifi" style="font-size:13px;color:#374151"></i>
        <i class="ti ti-battery-2" style="font-size:13px;color:#374151"></i>
        <span style="font-size:12px;color:#374151;">84%</span>
      </div>
    </div>

    <!-- Header -->
    <div class="chat-header">
      <div class="back-btn">
        <i class="ti ti-chevron-left" style="font-size:16px;color:var(--p700)"></i>
      </div>
      <div class="chat-avatar">
        <i class="ti ti-message-dots" style="font-size:18px;color:var(--p600)"></i>
      </div>
      <div class="chat-meta">
        <p class="chat-title">Satranç oynama etkinliği</p>
        <p class="chat-sub">
          <span class="online-dot"></span>
          0 mesaj · Çevrimiçi
        </p>
      </div>
      <div class="notif-btn">
        <i class="ti ti-bell" style="font-size:16px;color:var(--p700)"></i>
        <div class="notif-badge">2</div>
      </div>
    </div>

    <!-- Chat Body - Empty State -->
    <div class="chat-body">
      <div class="empty-state">
        <div class="empty-icon">
          <i class="ti ti-message-dots" style="font-size:28px;color:var(--p600)"></i>
        </div>
        <p class="empty-title">Henüz mesaj yok</p>
        <p class="empty-desc">İlk mesajı gönderip sohbeti<br>başlatabilirsin.</p>
      </div>
    </div>

    <!-- Message Input -->
    <div class="input-area">
      <div class="msg-input">Bir mesaj yaz…</div>
      <div class="send-btn">
        <i class="ti ti-send" style="font-size:16px;color:var(--p900)"></i>
      </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <div class="nav-item">
        <i class="ti ti-home" style="font-size:20px"></i>
        Ana Sayfa
      </div>
      <div class="nav-item">
        <i class="ti ti-map" style="font-size:20px"></i>
        Harita
      </div>
      <div class="nav-item">
        <div class="nav-center">
          <i class="ti ti-plus" style="font-size:22px;color:var(--p900)"></i>
        </div>
      </div>
      <div class="nav-item">
        <i class="ti ti-calendar" style="font-size:20px"></i>
        Takvim
      </div>
      <div class="nav-item">
        <i class="ti ti-user" style="font-size:20px"></i>
        Profil
      </div>
    </div>

  </div>
</div>
