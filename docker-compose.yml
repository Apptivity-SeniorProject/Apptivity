services:
  postgres:
    image: postgres:16-alpine
    container_name: apptivity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apptivity}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-apptivity}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apptivity-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: apptivity-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=${POSTGRES_DB:-apptivity};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__Redis: redis:6379
      Jwt__Issuer: ${JWT_ISSUER:-Apptivity.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Apptivity.Clients}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-Apptivity_Docker_Secret_Key_Min32Chars_XyZ!2026}
      Fcm__Enabled: ${FCM_ENABLED:-false}
      Fcm__ServerKey: ${FCM_SERVER_KEY:-}
      Admin__Email: ${Admin__Email:-}
      Admin__Password: ${Admin__Password:-}
      Groq__ApiKey: ${Groq__ApiKey:-}
      Groq__BaseUrl: ${Groq__BaseUrl:-https://api.groq.com/openai/v1}
      Groq__Model: ${Groq__Model:-openai/gpt-oss-20b}
      Groq__TimeoutMs: ${Groq__TimeoutMs:-120}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploaded_images:/app/wwwroot/uploaded_images

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: apptivity-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  uploaded_images:
